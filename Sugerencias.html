            .titulo::after {
        content: "";
        display: block;
        width: 100px;
        height: 4px;
        background-color: #b464dc;
        margin: 12px auto 0;
        border-radius: 10px;
        transition: 0.3s;
        }

        .titulo:hover::after {
            width: 180px;
        }

        /* Fila de navegación */
        .menu { 
        background-color: rgb(180, 100, 220); 
        height: 50px; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        }

        /* Fila de navegación */
        .menu { 
        background-color: rgb(180, 100, 220); 
        height: 50px; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        }

        .menu a {
    position: relative;
    color: white;
    text-decoration: none;
    padding: 14px 18px;
    font-size: 16px;
    }

    /* Cuando pasas el cursor */
    .menu a:hover {
        background-color: #000000;
    }

    /* Estelita */
    .menu a:hover::after {
        content: "✦";
        position: absolute;
        color: white;
        font-size: 18px;
        right: 5px;
        top: 3px;
        text-shadow: 0 0 8px white;
        animation: estelita 1s infinite alternate;
    }

    /* Animación de la estelita */
    @keyframes estelita {
        from {
            transform: scale(1) rotate(0deg);
            opacity: 1;
        }

        to {
            transform: scale(1.3) rotate(20deg);
            opacity: 1;
        }
    }

        /* NUEVA FILA DE TEXTO */
        .fila-texto {
            background-color: rgb(7, 6, 7);
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

            font-size: 20px;
